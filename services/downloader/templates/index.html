<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonus</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --text: #e8e8f0;
      --muted: #7878a0;
      --accent: #1da0c3;
      --accent-dim: #155f75;
      --green: #22c55e;
      --red: #ef4444;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p { color: var(--muted); margin-top: 6px; font-size: 13px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 700px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 12px 14px;
      resize: vertical;
      min-height: 130px;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: var(--accent-dim); }
    textarea::placeholder { color: var(--muted); }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 20px;
      transition: opacity 0.15s, background 0.15s;
    }

    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:not(:disabled):hover { background: #18b8df; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:not(:disabled):hover { color: var(--text); border-color: var(--muted); }

    .conn-indicator {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .conn-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    /* Jobs */
    #jobs-section {
      width: 100%;
      max-width: 700px;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .job {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    /* Border driven by badge class — no outer class update needed */
    .job:has(.badge-downloading) { border-color: var(--accent-dim); }
    .job:has(.badge-done)        { border-color: #1a3d26; }
    .job:has(.badge-error)       { border-color: #3d1a1a; }

    details > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    details > summary:hover { background: var(--surface2); }
    details > summary::-webkit-details-marker { display: none; }

    .job-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-queued      { background: var(--muted); }
    .dot-downloading { background: var(--accent); animation: pulse 1.2s infinite; }
    .dot-done        { background: var(--green); }
    .dot-error       { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .job-url {
      flex: 1;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .job-meta {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .job-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .badge-queued      { background: var(--surface2); color: var(--muted); }
    .badge-downloading { background: var(--accent-dim); color: #7ce8ff; }
    .badge-done        { background: #1a3d26; color: var(--green); }
    .badge-error       { background: #3d1a1a; color: var(--red); }

    .log-inner {
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11.5px;
      line-height: 1.7;
      color: var(--muted);
      max-height: 220px;
      overflow-y: auto;
    }

    .log-line { display: block; }
    .log-line:last-child { color: var(--text); }

    /* htmx request indicator */
    .htmx-request .btn-primary { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1>Sonus Downloaders</h1>
    <p>Paste URLs — one per line. Ctrl+Enter to download. For now only Bandcamp URLs are supported.</p>
  </header>

  <div class="card">
    <form
      hx-post="/download"
      hx-swap="none"
      hx-on:htmx:after-request="this.querySelector('#urls').value = ''"
    >
      <label for="urls">URLs</label>
      <textarea
        id="urls"
        name="urls"
        placeholder="https://artist.bandcamp.com/album/album-name"
        spellcheck="false"
        onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter')this.form.requestSubmit()"
      ></textarea>
      <div class="actions">
        <button type="submit" class="btn-primary">Download</button>
        <button type="button" class="btn-ghost" onclick="document.getElementById('urls').value=''">Clear</button>
        <span class="conn-indicator">
          <span class="conn-dot" id="conn-dot"></span>
          <span id="conn-label">connecting…</span>
        </span>
      </div>
    </form>
  </div>

  {% if jobs %}
  <div id="jobs-section" class="jobs-section">
    <div class="section-header">
      <span class="section-title">Downloads</span>
      <button class="btn-ghost" style="font-size:12px;padding:5px 12px"
              hx-delete="/jobs" hx-swap="none">Clear finished</button>
    </div>
    <div
      id="jobs-list"
      hx-ext="sse"
      sse-connect="/events"
      sse-swap="new-job"
      hx-swap="afterbegin"
    >
      <!-- OOB sink: processes unnamed SSE messages (status/log updates) -->
      <div id="sse-sink" sse-swap="message" hx-swap="none"></div>
      {% for job in jobs %}
      {% include "_job.html" %}
      {% endfor %}
    </div>
  </div>
  {% else %}
  <div id="jobs-section" class="jobs-section" style="display:none">
    <div class="section-header">
      <span class="section-title">Downloads</span>
      <button class="btn-ghost" style="font-size:12px;padding:5px 12px"
              hx-delete="/jobs" hx-swap="none">Clear finished</button>
    </div>
    <div
      id="jobs-list"
      hx-ext="sse"
      sse-connect="/events"
      sse-swap="new-job"
      hx-swap="afterbegin"
    >
      <div id="sse-sink" sse-swap="message" hx-swap="none"></div>
    </div>
  </div>
  {% endif %}

  <script>
    // SSE connection indicator
    document.body.addEventListener('htmx:sseOpen', () => {
      document.getElementById('conn-dot').style.background = 'var(--green)';
      document.getElementById('conn-label').textContent = 'connected';
    });
    document.body.addEventListener('htmx:sseError', () => {
      document.getElementById('conn-dot').style.background = 'var(--red)';
      document.getElementById('conn-label').textContent = 'reconnecting…';
    });

    // Show jobs section when first job arrives
    document.body.addEventListener('htmx:afterSettle', (e) => {
      if (e.target.id === 'jobs-list' || e.target.closest?.('#jobs-list')) {
        const section = document.getElementById('jobs-section');
        if (section) section.style.display = '';
      }
      // Auto-open details when a job starts downloading
      if (e.target.classList?.contains('badge-downloading')) {
        e.target.closest('.job')?.querySelector('details')?.setAttribute('open', '');
      }
      // Scroll log to bottom when new line arrives
      const logsEl = e.target.id?.startsWith('logs-') ? e.target : e.target.querySelector?.('[id^="logs-"]');
      if (logsEl) logsEl.scrollTop = logsEl.scrollHeight;
    });
  </script>
</body>
</html>
