services:
  sonus-downloader:
    image: ghcr.io/erenyenigul/sonus-downloader:latest
    ports:
      - "8080:8000"
    restart: unless-stopped
    environment:
      MUSIC_DIR: "/music"
      MAX_WORKERS: "3"
    volumes:
      - ${MUSIC_DIR}:/music

  sonus-navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_ENABLETRANSCODINGCONFIG: "true"
    volumes:
      - ${DATA_DIR}:/data
      - ${MUSIC_DIR}:/music:ro

  sonus-filebrowser:
    image: filebrowser/filebrowser:latest
    user: "1000:1002"
    volumes:
      - ${MUSIC_DIR}:/srv
      - ${FILEBROWSER_DB_DIR}:/database
    ports: ["9999:80"]
