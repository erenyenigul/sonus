[tool.poetry]
name = "sonus-downloader"
version = "0.1.0"
description = "Bandcamp downloader with HTMX UI"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0"}
jinja2 = ">=3.1.0"
python-multipart = ">=0.0.12"
requests = ">=2.33.0"
mutagen = ">=1.47.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
